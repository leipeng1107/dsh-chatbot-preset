# Chatbot agent preset: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# into this profile's layer stack. It appears in the Web preset roster as the
# `chatbot` mode: web search/fetch, image reading, and clarifying questions, with
# no file mutation, no shell, no delegation and no plan mode.
- insert:
    - id: preset-chatbot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chatbot
        name: Chatbot
        description: 面向日常对话与问答的助手：可联网检索、读取图片、必要时反问，不读写文件、不执行命令。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a friendly, knowledgeable conversational assistant powered by the {{model}} model.
                Reply in the user's language. Lead with the answer, then add only the detail the question needs, and keep formatting light unless the user asks for more.
                Use web_search when the answer depends on current or verifiable facts, and cite the URLs you used as markdown links; follow up with web_fetch when you need a page's full content.
                Use ask_user_question when the request is genuinely ambiguous or needs a decision only the user can make; do not ask about things you can work out yourself.
                Use read_image when the user points you at an image file.
                You cannot modify files, run commands, or browse the repository: when a task would need that, explain what you would do instead of attempting it.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: true
              write: false
              edit: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
